<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <title>Service unavailable | Lemoine Medical</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #102a4c;
        background: #ffffff;
      }
      * { box-sizing: border-box; }
      body { min-width: 280px; min-height: 100vh; margin: 0; background: #ffffff; }
      .page { width: min(1120px, calc(100% - 48px)); min-height: 100vh; margin: 0 auto; display: grid; grid-template-rows: auto 1fr auto; }
      header, footer { padding: 32px 0; font-size: 1rem; font-weight: 650; letter-spacing: -0.01em; }
      header { border-bottom: 1px solid #d9e1e8; }
      footer { border-top: 1px solid #d9e1e8; color: #445b73; font-size: 0.875rem; }
      main { display: grid; place-items: center; padding: 72px 0; text-align: center; }
      .message { max-width: 820px; }
      h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.25rem, 5vw, 4.25rem); font-weight: 600; line-height: 1.08; letter-spacing: -0.035em; text-wrap: balance; }
      .rule { width: 68px; height: 4px; margin: 36px auto 30px; border-radius: 2px; background: #4ea9a2; }
      p { margin: 0; color: #445b73; font-size: clamp(1.05rem, 2vw, 1.3rem); line-height: 1.6; text-wrap: balance; }
      @media (max-width: 600px) {
        .page { width: min(100% - 32px, 1120px); }
        header, footer { padding: 24px 0; }
        main { padding: 52px 0; }
        .rule { margin: 28px auto 24px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>Lemoine Medical</header>
      <main>
        <section class="message" aria-labelledby="service-status">
          <h1 id="service-status">This service is no longer available.</h1>
          <div class="rule" aria-hidden="true"></div>
          <p>If you need access restored, contact your organization administrator.</p>
        </section>
      </main>
      <footer>Lemoine Medical</footer>
    </div>
  </body>
</html>
